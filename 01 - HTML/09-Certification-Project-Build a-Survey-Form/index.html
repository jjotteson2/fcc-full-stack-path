<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Programming Survey</h1>
    <p id="description">Thank you for taking the time to take this survey</p>
    <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input id="name" type="text" placeholder="Enter your name" required>
        <br>
        <label for="email" id="email-label">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br>
        <label for="number" id="number-label">Age (optional)</label>
        <input type="number" id="number" placeholder="Age" min="0" max="1000">
        <br>
        <label for="dropdown">What is your favorite programming language?</label>
        <select name="favorite-language" id="dropdown">
            <option value="python">Python</option>
            <option value="javaScript">JavaScript</option>
            <option value="java">Java</option>
        </select>
        <br>
        <label for="like-programming">Do you like programming</label>
        <label for="yes-option">Yes</label>
        <input type="radio" name="yes-no-option" id="yes-option" value="yes">
        <label for="no-option">No</label>
        <input type="radio" name="yes-no-option" id="no-option" value="no">
        <br>
        <label>What do you like to do with programming?</label>
        <br>
        <label>Make Websites</label>
        <input type="checkbox" value="Websites">
        <label>Make Games</label>
        <input type="checkbox" value="games">
        <label>Automate Stuff</label>
        <input type="checkbox" value="automate-stuff">
        <br>
        <label for="other-comments">Other Comments</label>
        <textarea name="comments" id="other-comments"></textarea>
        <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>
