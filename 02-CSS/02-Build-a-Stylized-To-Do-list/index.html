<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="contribute">
            <label for="contribute">Contribute to freecodecamp</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/" class="sub-item-link" target="_blank">freecodecamp</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="labs">
            <label for="labs">Do some labs</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/" class="sub-item-link" target="_blank">freecodecamp</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="workshops">
            <label for="workshops">Do some workshops</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/" class="sub-item-link" target="_blank">freecodecamp</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="music">
            <label for="music">Listen to music</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/" class="sub-item-link" target="_blank">freecodecamp</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
